name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Exact source commit for the vendored legacy and V1 conformance artifacts.
  SPEC_REF: a7e359ac2bc2efbc89febc7c4a5cd42dec03eade

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The conformance corpus lives in the specification repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cvd-policy/spec
          ref: ${{ env.SPEC_REF }}
          path: cvd-policy-spec
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vendored specification is current
        run: npm run sync:spec:check
        env:
          CVD_SPEC_DIR: ${{ github.workspace }}/cvd-policy-spec

      - name: Library, command line tool and site
        run: npm test
        env:
          CVD_SPEC_DIR: ${{ github.workspace }}/cvd-policy-spec

      - name: Types
        run: npm run typecheck -w @cvd-policy/core

      - name: Site
        run: |
          npm run check -w site
          npm run build -w site
